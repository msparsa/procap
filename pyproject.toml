[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "procap"
version = "2.0.0"
description = "ProCap: Protein Capability Benchmark for evaluating Protein Language Models across Bloom's Taxonomy"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Mohammad Parsa", email = "mparsa@berkeley.edu"}
]

classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    # Core ML
    "torch>=2.0.0",
    "transformers>=4.30.0",

    # Data handling
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "pyarrow>=12.0.0",

    # ML utilities
    "scikit-learn>=1.3.0",
    "scipy>=1.10.0",

    # Configuration
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "typer[all]>=0.9.0",

    # Metrics for generation tasks
    "sacrebleu>=2.3.0",
    "rouge-score>=0.1.2",
    "bert-score>=0.3.13",

    # Progress and logging
    "tqdm>=4.65.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "black>=23.0.0",
    "ruff>=0.0.280",
    "mypy>=1.4.0",
]

[project.scripts]
procap = "procap.cli:app"

[project.urls]
Homepage = "https://github.com/msparsa/procap-bench"
Repository = "https://github.com/msparsa/procap-bench"

[tool.setuptools.packages.find]
where = ["."]
include = ["procap*"]
exclude = ["tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]
